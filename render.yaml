# Render Blueprint — connect this repo and set Root Directory if not using this file.
# Dashboard: New → Blueprint → connect GitHub repo, or link existing service to this file.

services:
  - type: web
    name: flight-search-ai-agent
    runtime: python
    region: singapore
    plan: free
    rootDir: flight-search-ai-agent
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      streamlit run app.py
      --server.port=$PORT
      --server.address=0.0.0.0
      --server.headless=true
      --browser.gatherUsageStats=false
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: OPENAI_API_KEY
        sync: false
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
